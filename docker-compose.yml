services:
  db:
    image: postgres:15-alpine
    container_name: bybit_bot_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD} 
      POSTGRES_DB: ${DB_NAME:-bybit_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bybit_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
  bot:
    build: .
    volumes:
      - .:/app
    container_name: bybit_bot_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_URL=${DB_URL:-postgresql+asyncpg://postgres:admin1234@localhost:5432/bybit_bot}
    logging:
      driver: "json-file"
      options:
        max-size: 10m
        max-file: 3
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535

volumes:
  postgres_data:
