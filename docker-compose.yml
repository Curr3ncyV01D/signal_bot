services:
  db:
    image: postgres:15-alpine
    container_name: bybit_bot_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD:
      POSTGRES_DB: bybit_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
  bot:
    build: .
    container_name: bybit_bot_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_URL=postgresql+asyncpg://postgres:@db:5432/bybit_bot
    logging:
      driver: "json-file"
      options:
        max-size: 10m
        max-file: 3

volumes:
  postgres_data:
