services:
  db:
    image: postgres:15-alpine
    container_name: ${PROJECT_NAME}_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-bybit_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bybit_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:${EXTERNAL_DB_PORT:-5433}:5432"

  redis:
    image: redis:7.2-alpine
    container_name: ${PROJECT_NAME}_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT:-6379}
    ports:
      - "${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
    volumes:
      - redis_data:/data
    mem_limit: 512mb

  brain:
    build: .
    volumes:
      - .:/app
    container_name: ${PROJECT_NAME}_brain
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - DB_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-6379}/0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    cpu_shares: 2048
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535

  artist:
    build: .
    command: python -m src.services.workers.chart_worker
    volumes:
      - .:/app
    container_name: ${PROJECT_NAME}_artist
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - DB_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-6379}/0
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    cpu_shares: 512

  messenger:
    build: .
    command: python -m src.services.workers.messenger_worker
    volumes:
      - .:/app
    container_name: ${PROJECT_NAME}_messenger
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - DB_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-6379}/0
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    cpu_shares: 1024
    
volumes:
  postgres_data:
  redis_data:
